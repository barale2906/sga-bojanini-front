<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- Logo -->
  <div class="sidebar__logo">
    @if (!collapsed) {
      <div class="sidebar__brand">
        <span class="sidebar__brand-name">SGA</span>
        <span class="sidebar__brand-sub">Bojanini</span>
      </div>
    } @else {
      <span class="sidebar__brand-icon">SGA</span>
    }
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    @for (item of menuService.menu(); track item.key) {
      <a
        class="sidebar__item"
        [class.sidebar__item--active]="item.children.length === 0 ? isLeafActive(item) : isGroupActive(item)"
        [routerLink]="item.children.length === 0 ? resolveRoute(item.route) : getFirstChildRoute(item)"
        [matTooltip]="collapsed ? item.label : ''"
        matTooltipPosition="right"
      >
        <mat-icon class="sidebar__item-icon">{{ resolveIcon(item.icon) }}</mat-icon>
        @if (!collapsed) {
          <span class="sidebar__item-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Usuario en el pie -->
  @if (!collapsed) {
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <mat-icon>person</mat-icon>
        <span class="sidebar__user-name">{{ auth.userName() }}</span>
      </div>
    </div>
  }
</aside>
