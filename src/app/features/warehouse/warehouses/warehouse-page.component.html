<!-- ── Vista lista ────────────────────────────────────────── -->
@if (view() === 'list') {
  <app-page-header title="Almacenes" subtitle="Gestión de almacenes, zonas y ubicaciones" icon="warehouse">
  </app-page-header>

  <div class="page-toolbar" [formGroup]="whFilters">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar almacén</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput formControlName="search" placeholder="Nombre o código..." />
    </mat-form-field>
    <mat-form-field appearance="outline" class="select-field">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="is_active">
        <mat-option value="">Todos</mat-option>
        <mat-option value="true">Activos</mat-option>
        <mat-option value="false">Inactivos</mat-option>
      </mat-select>
    </mat-form-field>
    <button *sgaPermission="'almacenes.crear'" mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> Nuevo Almacén
    </button>
  </div>

  <app-loading-spinner [loading]="loading()" [inline]="true"></app-loading-spinner>

  <div class="table-wrap mat-elevation-z1">
    <table mat-table [dataSource]="warehouses()">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let w">{{ w.name }}</td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let w">{{ w.address || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let w">
          <span class="badge" [class.badge--on]="w.is_active" [class.badge--off]="!w.is_active">
            {{ w.is_active ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="act">Acciones</th>
        <td mat-cell *matCellDef="let w" class="act">
          <button mat-icon-button color="primary" (click)="openDetail(w)"
                  matTooltip="Gestionar zonas y ubicaciones">
            <mat-icon>tune</mat-icon>
          </button>
          <button *sgaPermission="'almacenes.eliminar'" mat-icon-button color="warn"
                  (click)="deleteWarehouse(w)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="whCols"></tr>
      <tr mat-row *matRowDef="let row; columns: whCols;" class="table-row"
          (click)="openDetail(row)"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="no-data" [attr.colspan]="whCols.length">Sin almacenes registrados</td>
      </tr>
    </table>
  </div>
}

<!-- ── Vista detalle / formulario ────────────────────────── -->
@if (view() === 'form') {
  <app-warehouse-detail-form
    [warehouseId]="editingWarehouseId()"
    (saved)="onSaved()"
    (back)="onBack()">
  </app-warehouse-detail-form>
}
